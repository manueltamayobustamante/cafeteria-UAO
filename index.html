<body class="bg-slate-50 text-slate-800 antialiased font-sans">

  <script type="text/babel">

    // Menú Inicial Por Defecto (Campus UAO Cali)

        tag: "Refrescante",
        tagColor: "bg-lime-100 text-lime-800 border-lime-200",

        tag: "Favorito Estudiantil",
        tagColor: "bg-orange-100 text-orange-800 border-orange-200",

      }
    ];

    const UAO_LOCATIONS = [
      "Cafetería Central (Edificio de Aulas)",
      "Punto Express (Torre Central)",
      "Kiosco Deportivo / Canchas",
      "Cafetería Edificio de Laboratorios"
    ];

    function App() {
      const [role, setRole] = useState('user'); // 'user' | 'admin'
      const [menuItems, setMenuItems] = useState(initialMenuItems);
      const [cart, setCart] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [pickupLocation, setPickupLocation] = useState(UAO_LOCATIONS[0]);
      const [paymentMethod, setPaymentMethod] = useState('nequi');
      const [currentOrder, setCurrentOrder] = useState(null);
      const [orderStatus, setOrderStatus] = useState(0); 
      const [showFirebaseModal, setShowFirebaseModal] = useState(false);
      const [firebaseConnected, setFirebaseConnected] = useState(false);
      const [jsonConfigInput, setJsonConfigInput] = useState('');
      const [rawMenuInput, setRawMenuInput] = useState('');
      const [notification, setNotification] = useState('');
      
      const dbRef = useRef(null);
      const channelRef = useRef(null);

      const triggerNotification = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(''), 4000);
      };

      // Inicializar canal multiventana (BroadcastChannel) y Firebase si existe config
      useEffect(() => {
        // BroadcastChannel Fallback para sincronización en el mismo navegador
        if ('BroadcastChannel' in window) {
          channelRef.current = new BroadcastChannel('uao_menu_channel');
          channelRef.current.onmessage = (event) => {
            if (event.data && event.data.type === 'MENU_UPDATE') {
              setMenuItems(event.data.payload);
            }
          };
        }

        // Cargar Firebase de localStorage si existe
        const savedFbConfig = localStorage.getItem('uao_firebase_config');
        if (savedFbConfig) {
          try {
            initFirebase(JSON.parse(savedFbConfig));
          } catch(e) {
            console.warn("Config de Firebase guardada inválida", e);
          }
        }
      }, []);

      const initFirebase = (configObj) => {
        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(configObj);
          }
          dbRef.current = firebase.firestore();
          setFirebaseConnected(true);
          
          // Escuchar cambios en tiempo real desde Firestore
          dbRef.current.collection('uao_menu').doc('current').onSnapshot((doc) => {
            if (doc.exists && doc.data().items) {
              setMenuItems(doc.data().items);
            }
          }, (err) => {
            console.error("Error al escuchar Firestore:", err);
          });

          triggerNotification("¡Conectado a Firebase Cloud correctamente!");
        } catch (error) {
          console.error("Fallo al inicializar Firebase:", error);
          alert("Error de conexión a Firebase: " + error.message);
        }
      };

      const handleSaveFirebaseConfig = () => {
        if (!jsonConfigInput.trim()) {
          alert("Por favor pega el código JSON de Firebase.");
          return;
        }
        try {
          // Limpiar strings si pegaron const firebaseConfig = ...
          let cleanInput = jsonConfigInput.trim();
          if (cleanInput.startsWith('const firebaseConfig =')) {
            cleanInput =
